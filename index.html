  .hero{
    padding: calc(36px + env(safe-area-inset-top)) 19px 27px;
  }
  .hero .dates{
    font-family: 'Roboto Mono', 'Courier New', monospace;
    font-size: 12px;
    letter-spacing: 0.06em;
    color: var(--gold);
    margin: 0 0 6px;
  }
  .hero .sun{
    font-family: 'Roboto Mono', 'Courier New', monospace;
    font-size: 11.5px;
    letter-spacing: 0.03em;
    color: rgba(242,245,244,0.65);
    margin: 0 0 4px;
    min-height: 14px;
  }
  .hero .weather{
    font-family: 'Roboto Mono', 'Courier New', monospace;
    font-size: 11.5px;
    letter-spacing: 0.03em;
    margin: 0;
  }
  .hero .weather a{
    color: rgba(242,245,244,0.75);
    text-decoration: none;
    border-bottom: 1px solid rgba(242,245,244,0.35);
  }
  .hero .weather a:hover{ border-bottom-color: rgba(242,245,244,0.75); }
  .hero h1{
    font-family: 'Roboto', Arial, sans-serif;
    font-weight: 700;
    font-size: 32px;
    line-height: 1.05;
    margin: 0 0 8px;
    letter-spacing: -0.02em;
  }
  .hero .sub{
    font-size: 14px;
    color: rgba(242,245,244,0.85);
    margin: 0 0 6px;
  }
  .hero .sub a{
    color: rgba(242,245,244,0.72);
    text-decoration: none;
    border-bottom: 1px solid rgba(242,245,244,0.35);
  }
  .hero .sub a:hover{ border-bottom-color: rgba(242,245,244,0.72); }

  /* Tabs */
  .tabs{
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 14px 16px 14px;
    background: #2fa4c9;
    position: sticky;
    top: 0;
    z-index: 5;
    scrollbar-width: none;
  }
  .tabs::-webkit-scrollbar{ display:none; }
  .tab{
    flex: 0 0 auto;
    font-family: 'Roboto Mono', 'Courier New', monospace;
    font-size: 12.5px;
    letter-spacing: 0.02em;
    color: rgba(243,239,228,0.68);
    background: transparent;
    border: 1px solid rgba(243,239,228,0.28);
    border-radius: 999px;
    padding: 8px 14px;
    cursor: pointer;
    white-space: nowrap;
    transition: all 0.18s ease;
  }
  .tab.active{
    background: var(--gold);
    border-color: var(--gold);
    color: var(--lake-deep);
    font-weight: 500;
  }
  .tab:focus-visible{ outline: 2px solid var(--paper); outline-offset: 2px; }

  /* Day panel */
  .panel{ display:none; padding: 26px 18px 10px; max-width: 560px; margin: 0 auto; }
  .panel.active{ display:block; animation: fade 0.25s ease; }
  @keyframes fade{ from{opacity:0; transform: translateY(4px);} to{opacity:1; transform: translateY(0);} }

  .day-title{
    font-family: 'Roboto', Arial, sans-serif;
    font-size: 21px;
    font-weight: 700;
    letter-spacing: -0.01em;
    margin: 0 0 4px;
  }
  .day-caption{
    font-family: 'Roboto Mono', 'Courier New', monospace;
    font-size: 11.5px;
    color: var(--granite);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin: 0 0 22px;
  }

  /* Trail list */
  .trail{ position: relative; padding-left: 26px; }
  .trail::before{
    content:'';
    position: absolute;
    left: 6px; top: 6px; bottom: 6px;
    width: 2px;
    background: repeating-linear-gradient(to bottom, var(--line) 0 6px, transparent 6px 11px);
  }
  .stop{ position: relative; margin-bottom: 20px; }
  .stop::before{
    content:'';
    position: absolute;
    left: -28px; top: 1px;
    width: 16px; height: 18px;

  {
    label: "Bears",

    stops: [
      {name:"Welcome", blurb:"You're visiting a stunning natural environment—home to incredible wildlife, including black bears. These beautiful creatures are a vital part of the local ecosystem, and we ask that you help us protect them (and your vacation!) by being Bear Aware."},
      {name:"Bear Activity in the Area", blurb:"• Black bears are common in spring, summer, and fall.<br>• They've become accustomed to human food and garbage, which means they may approach homes and vehicles.<br>• Feeding bears is illegal, and unsecured trash or food can lead to serious property damage."},
      {name:"Quick Bear Facts", blurb:"• Color: Not always black—some are tan or brown.<br>• Size: Females weigh 100–200 lbs; males up to 350 lbs.<br>• Diet: Omnivores—will eat just about anything.<br>• Smell: 10x stronger than a bloodhound!<br>• Memory: They remember where they found food.<br><br>They're attracted to:<br>• BBQ grills & coolers<br>• Pet food & bird seed<br>• Wrappers, cans & trash<br>• Scented items (candles, toiletries, lip balm, lotion, toothpaste)"},
      {name:"Bear Season Timeline", blurb:"• Most active: Spring through fall, especially mid-August.<br>• Hibernation: Starts mid-November (as late as January in warm winters)."},
      {name:"What You Can Do to Help", blurb:"DO:<br>• Store garbage in bear-proof containers.<br>• Take pet food indoors overnight.<br>• Clean BBQs thoroughly after use.<br>• Lock all ground-level doors and windows when away.<br>• Remove all food, toiletries, and coolers from vehicles.<br><br>DON'T:<br>• Leave trash or food out, even briefly.<br>• Assume screened windows are bear-safe.<br>• Leave scented items on decks or in your car."},
      {name:"If You See a Bear", blurb:"In Your Yard:<br>• Stay calm, don't run.<br>• Assert yourself: yell, bang pots, or throw rocks.<br>• Make the bear feel unwelcome.<br><br>In the Woods:<br>• Respect their space, don't run.<br>• Make your presence known without threatening.<br>• Pick up small children and move calmly and confidently."},
      {name:"Respect Wildlife, Protect Bears", blurb:"We're all guests in their home. By following these simple steps, you're helping ensure bears stay wild and safe.<br><br>For more information or bear-related concerns, contact:<br>Bear League: <a href=\"tel:+15305257297\">530-525-PAWS (7292)</a><br><a href=\"https://www.savebears.org/\" target=\"_blank\" rel=\"noopener\">Bear League Website</a>"},
    ]
  },
  {

      {name:"Boat day (10:00-1:30 PM)", time:"9:30 AM", icon:"boat", blurb:"Launch at <a href=\"https://www.google.com/maps/search/?api=1&query=7220+N+Lake+Blvd%2C+Tahoe+Vista%2C+CA\" target=\"_blank\" rel=\"noopener\">7220 N Lake Blvd, Tahoe Vista, CA</a><br>Boat itinerary: Emerald Bay, swimming, tubing<br>Snacks and drinks on boat<br><a href=\"https://northlaketahoeboatrental.com/faqs/\" target=\"_blank\" rel=\"noopener\">FAQs</a>"},

    stops: [
      {name:"Ayse & Eric B. depart", time:"10:10 PM", blurb:"SFO–PHL"},

      {name:"Stephanie & Indi depart", time:"11:59 PM", blurb:"SFO–EWR"},

];

const tabsEl = document.getElementById('tabs');
const panelsEl = document.getElementById('panels');

days.forEach((day, i) => {
  const tab = document.createElement('button');
  tab.className = 'tab' + (i === 3 ? ' active' : '');
  tab.textContent = day.label;
  tab.setAttribute('data-index', i);
  tab.addEventListener('click', () => showDay(i));
  tabsEl.appendChild(tab);

  const panel = document.createElement('div');
  panel.className = 'panel' + (i === 3 ? ' active' : '');
  panel.setAttribute('data-index', i);

  const stopsHtml = day.stops.map(s => `
    <div class="stop${s.tbd ? ' tbd' : ''}${s.icon ? ' icon-' + s.icon : ''}">
      <div class="stop-card">
        ${s.time ? `<div class="stop-time">${s.time}</div>` : ''}
        <div class="stop-name">${s.name}</div>
        ${s.blurb ? `<div class="stop-blurb">${s.blurb}</div>` : ''}
      </div>
    </div>
  `).join('');

  panel.innerHTML = `
    <div class="day-title">${day.title}</div>
    <div class="day-caption">${day.caption}</div>
    <div class="trail${day.icon ? ' icon-' + day.icon : ''}">${stopsHtml}</div>
  `;
  panelsEl.appendChild(panel);
});

function showDay(index){
  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', +t.getAttribute('data-index') === index));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', +p.getAttribute('data-index') === index));
  document.querySelector(`.tab[data-index="${index}"]`).scrollIntoView({behavior:'smooth', inline:'center', block:'nearest'});
  document.getElementById('sunInfo').textContent = days[index].sun || '';
}

// Default to Monday (first travel day) on load
showDay(3);
</script>

</body>
